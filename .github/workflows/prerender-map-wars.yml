name: One-time Map Wars prerender

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prerender:
    if: github.head_ref == 'agent/prerender-map-wars'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate static pages
        env:
          BUILD_NOW: '2026-07-26T03:00:00Z'
        run: node build.js

      - name: Run build-output regression tests
        run: node --test tests/build-output.test.js

      - name: Commit generated publication files and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/prerender-map-wars.yml
          git config user.name "topchinacar-publisher"
          git config user.email "publisher@topchinacar.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Prerender Map Wars series"
          git push origin HEAD:${{ github.head_ref }}
